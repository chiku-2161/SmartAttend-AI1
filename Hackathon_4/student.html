<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Login Container -->
<div id="loginContainer" class="login-container">
    <div class="login-card">
        <h2>Student Login 🎓</h2>
        <input type="text" id="studentRegNo" placeholder="Enter Registration Number">
        <button id="studentLoginBtn">Login</button>
        <p id="loginError" class="error"></p>
    </div>
</div>

<!-- Dashboard Container -->
<div id="studentDashboard" class="dashboard" style="display:none;">
    <div class="sidebar">
        <h2>Student Panel</h2>
        <ul>
            <li class="active">Dashboard</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Welcome, <span id="studentName">Student</span> 🎓</h1>

        <!-- Overall Attendance -->
        <div class="overall-card">
            <h2>Overall Attendance</h2>
            <div class="circle" id="overallPercent">0%</div>
        </div>

        <!-- Subject Cards -->
        <div class="subject-container" id="subjectContainer">
            <!-- Cards dynamically populated -->
        </div>

        <!-- Chart -->
        <div class="chart-section" id="studentChartSection" style="display:none;">
            <canvas id="studentAttendanceChart"></canvas>
        </div>
    </div>
</div>

<script>
// ===== Student Dashboard JS =====

// Chart instance
let studentChartInstance = null;

// Fetch attendance from backend
async function fetchAttendanceUpdate(regNo) {
    try {
        const response = await fetch("https://your-backend.com/api/fetch-student-attendance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ regNo })
        });

        const data = await response.json();
        if (data.success) {
            // Update overall
            document.getElementById("overallPercent").textContent = data.student.overallAttendance + "%";

            // Update subjects
            const container = document.getElementById("subjectContainer");
            container.innerHTML = "";
            data.student.subjects.forEach(sub => {
                const card = document.createElement("div");
                card.className = "subject-card";
                card.innerHTML = `
                    <h3>${sub.name}</h3>
                    <div class="progress-bar">
                        <div class="progress" style="width:${sub.attendancePercent}%;">
                            ${sub.attendancePercent}%
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Update chart
            const ctx = document.getElementById("studentAttendanceChart");
            if (studentChartInstance) {
                studentChartInstance.data.labels = data.student.subjects.map(sub => sub.name);
                studentChartInstance.data.datasets[0].data = data.student.subjects.map(sub => sub.attendancePercent);
                studentChartInstance.update();
            }
        }
    } catch(err) {
        console.error("Polling error:", err);
    }
}

// Login
let pollingInterval = null;
document.getElementById("studentLoginBtn").addEventListener("click", async () => {
    const regNo = document.getElementById("studentRegNo").value.trim();
    const error = document.getElementById("loginError");

    if (!regNo) {
        error.textContent = "Please enter your registration number.";
        return;
    }

    error.textContent = "Loading...";

    try {
        const response = await fetch("https://your-backend.com/api/fetch-student-attendance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ regNo })
        });

        const data = await response.json();

        if (data.success) {
            error.textContent = "";
            document.getElementById("loginContainer").style.display = "none";
            document.getElementById("studentDashboard").style.display = "flex";

            document.getElementById("studentName").textContent = data.student.name;
            document.getElementById("overallPercent").textContent = data.student.overallAttendance + "%";

            // Populate subject cards
            const container = document.getElementById("subjectContainer");
            container.innerHTML = "";
            data.student.subjects.forEach(sub => {
                const card = document.createElement("div");
                card.className = "subject-card";
                card.innerHTML = `
                    <h3>${sub.name}</h3>
                    <div class="progress-bar">
                        <div class="progress" style="width:${sub.attendancePercent}%;">
                            ${sub.attendancePercent}%
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Chart
            const chartSection = document.getElementById("studentChartSection");
            chartSection.style.display = "block";
            const ctx = document.getElementById("studentAttendanceChart");
            studentChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.student.subjects.map(sub => sub.name),
                    datasets: [{
                        label: 'Attendance %',
                        data: data.student.subjects.map(sub => sub.attendancePercent),
                        backgroundColor: data.student.subjects.map(() => '#6366F1'),
                        borderRadius: 8
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: "#F1F5F9" } },
                        y: { ticks: { color: "#F1F5F9" }, beginAtZero: true, max: 100 }
                    }
                }
            });

            // Start polling every 10 seconds
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => fetchAttendanceUpdate(regNo), 10000);

        } else {
            error.textContent = data.message || "Invalid registration number.";
        }

    } catch(err) {
        console.error(err);
        error.textContent = "Server error. Try again later.";
    }
});

// Logout
function logout() {
    if (pollingInterval) clearInterval(pollingInterval);
    window.location.href = "index.html";
}
</script>

</body>
</html>
